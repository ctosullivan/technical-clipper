<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Capture — technical-clipper</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
        line-height: 1.5;
      }
      body {
        margin: 0;
        padding: 1.5rem;
        max-width: 60rem;
      }
      h1 {
        font-size: 1.15rem;
        margin: 0 0 0.25rem;
      }
      #reason {
        color: #666;
        margin: 0 0 1rem;
      }
      #warning-banner {
        background: #fff3cd;
        color: #664d03;
        border: 1px solid #ffe69c;
        padding: 0.6rem 0.8rem;
        border-radius: 6px;
        margin-bottom: 1rem;
      }
      dl {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 0.15rem 1rem;
        margin: 0 0 0.75rem;
      }
      dt {
        font-weight: 600;
      }
      dd {
        margin: 0;
      }
      #warnings {
        margin: 0 0 1rem;
        padding-left: 1.2rem;
        color: #664d03;
      }
      .toolbar {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 0.75rem;
      }
      button,
      select {
        font: inherit;
        padding: 0.35rem 0.7rem;
        border-radius: 6px;
        border: 1px solid #999;
        background: Canvas;
        cursor: pointer;
      }
      #preview {
        white-space: pre-wrap;
        word-break: break-word;
        background: #f6f8fa;
        border: 1px solid #d0d7de;
        border-radius: 6px;
        padding: 0.8rem;
        max-height: 60vh;
        overflow: auto;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.85rem;
      }
      #obsidian-note {
        color: #664d03;
        margin: 0.4rem 0;
      }
      @media (prefers-color-scheme: dark) {
        #reason {
          color: #aaa;
        }
        #preview {
          background: #161b22;
          border-color: #30363d;
        }
        #warning-banner {
          background: #3a2f00;
          color: #ffe69c;
          border-color: #665500;
        }
      }
    </style>
  </head>
  <body>
    <h1 id="headline">Capturing…</h1>
    <p id="reason"></p>
    <div id="warning-banner" hidden></div>

    <dl id="report"></dl>
    <ul id="warnings"></ul>

    <div id="actions">
      <div class="toolbar">
        <label
          >Profile
          <select id="profile">
            <option value="obsidian" selected>Obsidian</option>
            <option value="gfm">GFM</option>
            <option value="commonmark">CommonMark</option>
          </select>
        </label>
        <button id="copy">Copy Markdown</button>
        <button id="obsidian">Send to Obsidian</button>
        <button id="download">Download bundle</button>
        <label
          ><input type="checkbox" id="raw-toggle" /> include raw HTML</label
        >
      </div>
      <p id="obsidian-note" hidden></p>
    </div>

    <pre id="preview"></pre>

    <script type="module" src="results.js"></script>
  </body>
</html>
